name: One-shot upload of a test bundle to R2

# Puts a tiny "hello from R2" file under both the floating /v1/ key
# and the immutable /v1.0.0/ key so we can verify cdn.postio.co.uk
# serves with the right cache headers. Delete this workflow file
# after a successful run.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cdn-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: cdn-worker/package-lock.json
      - run: npm ci
      - name: Write test file
        run: |
          cat > /tmp/hello.js <<'EOF'
          // hello from cdn.postio.co.uk + R2
          console.log("Postio CDN is live");
          EOF
      - name: Upload to v1/hello.js (floating)
        run: npx wrangler r2 object put postio-cdn-bundles/v1/hello.js --file=/tmp/hello.js --content-type="application/javascript; charset=utf-8"
      - name: Upload to v1.0.0/hello.js (immutable)
        run: npx wrangler r2 object put postio-cdn-bundles/v1.0.0/hello.js --file=/tmp/hello.js --content-type="application/javascript; charset=utf-8"
      - name: List objects in bucket
        run: npx wrangler r2 bucket info postio-cdn-bundles || true
