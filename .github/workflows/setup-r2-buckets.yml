name: One-shot R2 bucket setup

# Creates the two R2 buckets the CDN Worker depends on. Idempotent —
# `wrangler r2 bucket create` exits 0 if the bucket already exists.
# Delete this file once both buckets are created and the CDN Worker
# is serving from R2.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cdn-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: cdn-worker/package-lock.json
      - run: npm ci
      - name: Create postio-cdn-bundles
        run: npx wrangler r2 bucket create postio-cdn-bundles || true
      - name: Create postio-cdn-bundles-stage
        run: npx wrangler r2 bucket create postio-cdn-bundles-stage || true
      - name: List buckets
        run: npx wrangler r2 bucket list
