name = "postio-cdn"
main = "src/index.js"
compatibility_date = "2026-04-30"
workers_dev = false

# Prod route. DNS for cdn.postio.co.uk is in place (CNAME → postio.co.uk,
# orange-cloud). With no R2 bucket bound, the Worker serves the
# "coming soon" page at / and 503 on versioned paths.
routes = [
  { pattern = "cdn.postio.co.uk/*", zone_name = "postio.co.uk" }
]

# Uncomment once `wrangler r2 bucket create postio-cdn-bundles` has run.
# [[r2_buckets]]
# binding = "BUNDLES"
# bucket_name = "postio-cdn-bundles"

# Stage variant — for early validation. DNS for stage-cdn.postio.co.uk
# needs adding (CNAME → postio.co.uk, orange-cloud) before the route
# can bind.
[env.stage]
name = "postio-cdn-stage"
# routes = [
#   { pattern = "stage-cdn.postio.co.uk/*", zone_name = "postio.co.uk" }
# ]

# [[env.stage.r2_buckets]]
# binding = "BUNDLES"
# bucket_name = "postio-cdn-bundles-stage"

[observability]
enabled = true
