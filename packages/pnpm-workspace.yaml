packages:
  - "*"

# Security floors for transitive deps of build/dev tooling (n8n node-cli,
# openapi-to-postmanv2, openapi-typescript) and of @modelcontextprotocol/sdk.
# Each selector only lifts versions inside the same major to the first fixed
# release. Drop an entry once the parent ships the fix itself.
overrides:
  handlebars@<4.7.10: 4.7.10
  undici@>=7 <7.30.1: 7.30.1
  axios@>=1 <1.20.0: 1.20.0
  brace-expansion@>=2 <2.1.7: 2.1.7
  js-yaml@>=4 <4.3.2: 4.3.2
  follow-redirects@<1.16.2: 1.16.2
  form-data@>=4 <4.0.6: 4.0.6
  lodash@<4.18.1: 4.18.1
  zod@>=4 <4.6.6: 4.6.6
  hono@>=4 <4.13.16: 4.13.16
  '@hono/node-server@>=2 <2.1.6': 2.1.6
  qs@>=6 <6.16.1: 6.16.1
  yaml@>=1 <1.10.3: 1.10.3
  # Cross-major lifts, checked against each caller (build tooling only):
  # uuid 8/10 -> 11: postman-collection and langchain (n8n node-cli) call
  #   only v1/v4/v7 with no buffer arg; 11 keeps the same CJS + ESM exports.
  # glob 11 -> 14: only rimraf 6 (n8n node-cli) imports it, for its glob
  #   option, which node-cli never sets; glob/globSync exports unchanged.
  uuid@<11.1.1: 11.1.1
  glob@>=9 <14.0.2: 14.0.2
